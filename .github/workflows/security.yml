name: security

# Trivy, on the repository and on the image it builds. It fails the build on a fixed HIGH or CRITICAL
# vulnerability, a committed secret, or a Dockerfile misconfiguration. It runs on pull requests and once a day, not on
# pushes: the daily run catches what is disclosed after the last change (a base image or a dependency),
# which a gate that only runs on change never sees.
#
# What it scans: go.mod and the three package-lock.json files (vulnerabilities), every tracked file
# (secrets), the Dockerfile and compose file (misconfiguration), and then the image itself, so the
# distroless base is covered too. Trivy itself is pinned to one release, because asking the installer for
# `latest` failed on every run from 8 November ("unable to find 'latest'") before it scanned anything; a fresh
# vulnerability database is downloaded on every run whatever the version, so a pin costs no coverage. Raise the pin
# when a newer Trivy is out. What it ignores is in .trivyignore.yaml, each entry with its reason.

on:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .claude,node_modules
          trivyignores: .trivyignore.yaml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # One architecture, loaded into the local daemon: the scan needs the layers, not the manifest list.
      - run: docker build -t tippani:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: tippani:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
