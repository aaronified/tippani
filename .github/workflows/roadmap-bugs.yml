name: roadmap-bugs

# The roadmap's "Known bugs" block is generated from the open issues carrying BOTH `bug`
# and `accepted`. This is the job that keeps it honest: on every issue event it rebuilds
# docs/data/tracker.json from the tracker, re-renders docs/roadmap.html, and commits if
# anything moved. When the published page itself moved, a second job dispatches
# pages.yml, which republishes it, so accepting a bug puts it on the roadmap and
# closing the issue takes it off, with no step in between that anyone has to remember.
# It dispatches rather than relying on the push because a push made with GITHUB_TOKEN
# starts no workflow, pages.yml included (the label step below says the same about
# labels). A workflow_dispatch is one of the events GitHub exempts from that rule.
#
# `accepted` is the gate, and it is the only one. Applying a label needs Triage, so an
# outside reporter cannot open it; filing alone publishes nothing. That matters because
# the roadmap is a public page and an ungated pipeline would put a stranger's title and
# body on it within a minute. Escaping stops markup; it does not make a wrong report right.
#
# What it deliberately does NOT do:
#   - touch docs/data/bugs.json or docs/data/features.json. Those are hand-owned, which
#     is what makes an `overrides` entry safe to write.
#   - apply `accepted` itself. It recovers `bug` / `enhancement`, which are classification;
#     acceptance is a judgement and stays mine.
#   - publish feature requests from the tracker at all. Those are a commit.
#   - write anything if the render fails verification. scripts/roadmap-data.mjs keeps the
#     previous page in docs/roadmap.backup.html and refuses to publish a broken one.

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, deleted, transferred]
  # Editing the hand-owned data files is the other way the block changes.
  push:
    branches: [main]
    paths:
      - "docs/data/bugs.json"
      - "docs/data/features.json"
      - "scripts/roadmap-data.mjs"
      - "scripts/roadmap-tracker.mjs"
  workflow_dispatch:

# The workflow's default, which render inherits. A job with a block of its own holds
# only what that block names, not this plus it: label holds issues: write, which
# labelling needs, and publish holds actions: write, which dispatching needs. So
# render, which runs two node scripts and saves its token in .git/config at
# checkout, holds neither.
permissions:
  contents: write
  issues: read

jobs:
  label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # An issue form's `labels:` is applied with the AUTHOR's permissions, and applying
      # a label needs Triage. So the one case this whole pipeline exists for — someone
      # outside the repo reporting a bug — is the one case where `labels: ["bug"]` does
      # nothing at all, and the report would never reach the page. Recover the label from
      # the form's own field headings, which are the most reliable evidence of which
      # template was used (the title prefix is only a prefill and can be edited away).
      #
      # This lives in this workflow rather than one of its own: an action
      # authenticated with GITHUB_TOKEN does not trigger further workflow runs, so a
      # separate labelling workflow would apply `bug` and never wake this one. It is a
      # job of its own, before render, because adding a label needs issues: write and
      # nothing else in the workflow does, and render needs it first so the tracker
      # read there already sees the label.
      #
      # Only ever ADDS. A label a maintainer removed on purpose stays removed.
      - name: Recover the label the form could not apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          case ",$LABELS," in
            *,bug,*|*,enhancement,*) echo "already classified: $LABELS"; exit 0 ;;
          esac
          want=""
          if   printf '%s' "$BODY" | grep -qF '### Steps to reproduce'; then want=bug
          elif printf '%s' "$BODY" | grep -qF '### What do you want to be able to do'; then want=enhancement
          elif printf '%s' "$TITLE" | grep -qiE '^\[bug\]'; then want=bug
          elif printf '%s' "$TITLE" | grep -qiE '^\[(feature|request)\]'; then want=enhancement
          fi
          if [ -z "$want" ]; then
            echo "not from either form and no prefix — leaving it unlabelled for manual triage"
            exit 0
          fi
          echo "applying '$want' to #$NUMBER"
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$want"

  render:
    needs: label
    # Runs after label, and also when label was skipped (a push or a dispatch) or
    # failed: a label it could not add is no reason to leave the page stale.
    if: ${{ !cancelled() }}
    # Never two renders at once: two runs would race on the same commit, and a
    # cancelled run could leave tracker.json describing a tracker state that no
    # longer exists. THE GROUP IS ON THIS JOB, NOT THE WORKFLOW. A pending member is
    # dropped when a newer one queues, and at workflow level that dropped the whole
    # run, label included. Each label job acts only on its own run's issue, so a
    # report superseded in a burst of issue activity stayed unlabelled until a
    # later event on it ran a label job that was not dropped as well. Out here,
    # label always runs. A dropped render loses nothing, because the newer one reads
    # the tracker afresh. publish needs no group: pages.yml has its own.
    concurrency:
      group: roadmap-bugs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      page_moved: ${{ steps.commit.outputs.page_moved }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read the tracker
        run: node scripts/roadmap-tracker.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the roadmap
        run: node scripts/roadmap-data.mjs

      # Second opinion: re-run in --check mode. If the generator is not idempotent the
      # page would flap on every event, and a flapping page is worse than a stale one.
      - name: Confirm it settled
        run: node scripts/roadmap-data.mjs --check

      - name: Commit if anything moved
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/roadmap.html docs/roadmap.backup.html docs/data/tracker.json; then
            echo "nothing changed"
            exit 0
          fi
          # tracker.json and the backup are not published, so a change to them alone
          # would redeploy an unchanged page, with only the sitemap's dates moved;
          # only the page itself asks for a deploy.
          page_moved=false
          git diff --quiet -- docs/roadmap.html || page_moved=true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.html docs/roadmap.backup.html docs/data/tracker.json
          git commit -m "docs: the roadmap catches up with the issue tracker

          Generated by .github/workflows/roadmap-bugs.yml. Hand-written entries live in
          docs/data/bugs.json; corrections to a generated entry go in its \`overrides\`."
          git push
          echo "page_moved=$page_moved" >> "$GITHUB_OUTPUT"

  publish:
    needs: render
    # A status function of its own, like render's. With none, GitHub adds
    # success(), which is false when any job earlier in the chain was skipped or
    # failed, and label is skipped on every push and dispatch. So a page render
    # moved would never have been deployed on those runs.
    if: ${{ !cancelled() && needs.render.result == 'success' && needs.render.outputs.page_moved == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Republish the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
