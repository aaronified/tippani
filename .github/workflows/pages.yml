name: pages

# Build the read-only demo (VITE_DEMO=1 → dummy-data fetch shim, relative base)
# and publish it to GitHub Pages at https://<owner>.github.io/tippani/. A push to
# main rebuilds it when it touches something the site is built or checked from,
# and a push that touches none of that does not: it would republish the same site
# and re-date every <lastmod> the sitemap step writes. The paths below are that
# list, so a new input is added to them. Two dispatches run it besides: by hand,
# to re-run a deploy that went red or was cancelled when the push that fixes it
# touches none of them; and from roadmap-bugs.yml, when its bot commit moved the
# roadmap page, because a push made with GITHUB_TOKEN starts no workflow even
# when it does touch them.
# Pages is turned on once by hand, in Settings → Pages → Source: "GitHub
# Actions"; the configure-pages step says why this job cannot do it.
on:
  push:
    branches: [main]
    paths:
      - "web/frontend/**"
      - "docs/landing.html"
      - "docs/roadmap.html"
      # The glossary step also copies files out of web/dist/, which is not listed.
      # Their names are content hashes, so a changed asset renames itself and
      # rewrites docs/ui-glossary.html (the entry below), and the mark is built
      # from web/frontend/public/, which is listed.
      - "docs/ui-glossary.html"
      - "docs/img/**"
      - ".github/workflows/pages.yml"
      # The deploy's own gate. A fix to it that does not re-run the deploy leaves
      # the last red run standing and the site on its last good deploy, which is
      # how aa0340fb landed: its push touched nothing above, so the fix went
      # unexercised until a hand-dispatched run.
      - "scripts/site-links.mjs"
      # src/i18n.js imports these with ?raw, so every interface string in the demo
      # is built from them, and a locale-only push changes the published demo. The
      # * stops at a slash, so internal/i18n/testdata/ stays out.
      - "internal/i18n/*.txt"
      # The bundle's inputs as scripts/dist-inputs.mjs derives them, rather than as
      # this list names them. A push that rebuilds dist carries a new manifest when
      # any input moved, so the next import from outside web/frontend redeploys
      # without this list learning its name. The glob above stays, because the
      # manifest only moves in a push that includes the rebuild.
      - "web/dist-inputs.json"
  # roadmap-bugs.yml dispatches this when its own commit moved docs/roadmap.html.
  # That push is made with GITHUB_TOKEN, which starts no workflow, so the path
  # above never fires for it. Removing this trigger or renaming this file breaks
  # that job.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web/frontend
      - name: Build demo
        run: npm run build:demo
        working-directory: web/frontend
        env:
          VITE_DEMO: "1"
      # The site root is a real HTML page, and the demo moved down to /demo/.
      #
      # It used to be the other way round, and that was the whole SEO problem:
      # the only thing at the root was the demo's index.html, which is
      # `<div id="root"></div>` and nothing else until JavaScript runs. A search
      # engine arriving at the canonical URL for this project found a one-word
      # lowercase title, no description, and no text — so there was nothing to
      # rank and nothing to show as a snippet. The demo is still one click away
      # and still rebuilt on every UI change; it simply is not the front door.
      - name: Assemble the site around the demo
        run: |
          set -euo pipefail
          mkdir -p _site/img
          cp docs/landing.html _site/index.html
          cp docs/roadmap.html docs/ui-glossary.html _site/
          # THE GLOSSARY POINTS INTO THE REPO. It is generated to be opened from
          # docs/, so its fonts, its material textures and its mark are
          # ../web/dist/…, and from the site root that is outside the site: every
          # one of them was a 404 on github.io. Copy exactly the files it names,
          # at the same paths under _site, and drop the "../".
          # The class stops where site-links.mjs's CSS_URL does, and also at ? and #
          # and whitespace, none of which is part of a file name here; change one and
          # change the other.
          { grep -oE "\.\./web/dist/[^\"')&?#[:space:]]+" _site/ui-glossary.html || true; } | sort -u |
            while read -r ref; do
              mkdir -p "_site/$(dirname "${ref#../}")"
              cp "${ref#../}" "_site/${ref#../}"
            done
          sed -i 's#\.\./web/dist/#web/dist/#g' _site/ui-glossary.html
          cp docs/img/*.jpg _site/img/
          # The social card. og:image must be absolute and must resolve from the
          # Pages origin — the README's screenshots live on raw.githubusercontent,
          # which is not this origin, so nothing here could have unfurled before.
          cp docs/img/library-paper-light.jpg _site/social.jpg
          # The icon the landing page and the docs reference.
          cp web/frontend/public/mark.svg _site/mark.svg
          # A 404 that offers the way back rather than GitHub's default.
          cp docs/landing.html _site/404.html

      - name: robots.txt and sitemap.xml
        run: |
          set -euo pipefail
          base="https://aaronified.github.io/tippani"
          # Written here rather than committed, so the URLs cannot drift from
          # the pages this job actually publishes.
          cat > _site/robots.txt <<EOF
          User-agent: *
          Allow: /
          Sitemap: ${base}/sitemap.xml
          EOF
          today=$(date -u +%Y-%m-%d)
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for path in "/" "/roadmap.html" "/ui-glossary.html" "/demo/"; do
              echo "  <url><loc>${base}${path}</loc><lastmod>${today}</lastmod></url>"
            done
            echo '</urlset>'
          } > _site/sitemap.xml

      # The published site is one page deeper than the app's own root, so the
      # manifest's root-absolute paths (start_url "/", icons "/icons/…") point
      # at github.io itself and 404. Vite's --base rewrites index.html only,
      # never a copied public asset. Correct for the self-hosted app, wrong
      # here — so the demo copy is rewritten in place.
      - name: Point the demo manifest at the demo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("_site/demo/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["start_url"] = "./"
          m["scope"] = "./"
          for icon in m.get("icons", []):
              icon["src"] = "." + icon["src"]
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(m, indent=2))
          PY
      # The site is assembled by copying, and nothing else checks that the
      # pieces agree. Every failure mode is silent: a copy step that stops
      # running, a screenshot renamed on one side of the move, a relative path
      # written for the old layout. Moving the demo to /demo/ makes the last one
      # live — `href="roadmap.html"` from inside the demo used to be correct and
      # now points at /demo/roadmap.html.
      - name: Every local link on the site resolves
        run: node scripts/site-links.mjs _site

      # Pages must already be on (Settings → Pages → Source: "GitHub Actions").
      # configure-pages' `enablement` input needs a token other than GITHUB_TOKEN
      # (its own action.yml says so), and this job has only GITHUB_TOKEN, so the
      # input is left off: on a fresh repo or a fork, the step then fails asking
      # for Pages to be enabled rather than attempting to create the site and
      # failing with a bare permission error.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
