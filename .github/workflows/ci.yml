name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      # -race, because two tests exist for the sole purpose of catching a
      # locking regression (TestConcurrentDuplicatePostsAllConflict,
      # TestReadersOverlapAWriter) and neither has ever run under it. The DSN
      # takes the write lock at BEGIN (_txlock=immediate) and the suite drives
      # real goroutines against a real SQLite file, so a data race here is a
      # data race in production, not a test artefact.
      # -race is 5-10x slower than a plain run, and Go's default per-package
      # test timeout is 10 minutes. internal/httpapi takes ~2 minutes unraced,
      # so it crossed 600s under -race as the suite grew and CI began failing
      # with a goroutine dump that looks like a deadlock and is not one — it is
      # the timeout firing mid-test. The number is generous on purpose: the
      # point of the limit is to catch a genuine hang, not to police duration.
      - run: go test -race -timeout 30m ./...

      # Smoke-test the `healthcheck` subcommand against a real running server
      # (the container HEALTHCHECK depends on it). Runs on the CI runner.
      - name: Smoke-test healthcheck
        run: |
          go build -o /tmp/tippani ./cmd/tippani
          TIPPANI_DATA="$(mktemp -d)" TIPPANI_BIND=127.0.0.1:8080 /tmp/tippani serve &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 20); do
            if /tmp/tippani healthcheck; then ok=1; break; fi
            sleep 0.5
          done
          [ "$ok" = 1 ] || { echo "server never became healthy"; exit 1; }
          # A dead port must make healthcheck fail (non-zero exit).
          if TIPPANI_BIND=127.0.0.1:8099 /tmp/tippani healthcheck; then
            echo "healthcheck should have failed against a dead port"; exit 1
          fi
          echo "healthcheck smoke test passed"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      # web/dist is a COMMITTED build artefact — the Go binary embeds it, so a
      # frontend change that ships without its rebuilt dist leaves the binary
      # serving the old UI with nothing to say so. DEVELOPMENT.md has warned
      # about this in prose since the beginning and nothing enforced it. The
      # runner has just produced a fresh dist; if it differs from what was
      # committed, the commit is incomplete.
      - name: web/dist matches the source it was built from
        run: |
          if ! git diff --exit-code -- web/dist; then
            echo
            echo "web/dist is stale. Run 'make frontend' and commit the result"
            echo "alongside your source change — the binary embeds this directory."
            exit 1
          fi
      # docs/ui-glossary.html inlines the built stylesheet so its samples are
      # styled by the rules the app actually ships. Every build renames
      # index-<hash>.css, so that snapshot rots silently — which is exactly how
      # the glossary ended up several releases behind before. This runs right
      # after the build, when web/dist is fresh, and fails if it is stale.
      - run: node scripts/glossary-css.mjs --check

  # The roadmap's generated regions are committed, so they can drift from
  # docs/data/*.json if someone edits the data and forgets to re-render. Catch it here
  # rather than letting the roadmap-bugs workflow silently correct it later.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/roadmap-data.mjs --check
      # The archive-header and greetings checks used to run here as standalone
      # node scripts, because this app had no frontend test runner. It has one
      # now, and both are Vitest tests under web/frontend/test/pure — covered by
      # `npm test` in the frontend job above.
