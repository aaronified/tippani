name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The full -race sweep runs here, not on every push: see `race-nightly` and
  # `race-nightly-httpapi`.
  schedule:
    - cron: "0 3 * * *"
  # By hand, the same sweep the schedule runs, so a change to it is measured the
  # day it is made rather than at the next 03:00.
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      # 20m, not 10m. The httpapi suite alone runs 12 minutes on a dev machine and
      # the reason is deliberate: almost every test signs a user up, and a signup
      # is a real bcrypt hash. It had been sitting a few seconds under the old
      # ceiling, so the next handful of tests anybody wrote would have tipped it —
      # and a timeout reads as a hung test rather than as a budget, which is a
      # confusing morning for whoever's commit lands on it.
      - run: go test -timeout 20m ./...

      # Smoke-test the `healthcheck` subcommand against a real running server
      # (the container HEALTHCHECK depends on it). Runs on the CI runner.
      - name: Smoke-test healthcheck
        run: |
          go build -o /tmp/tippani ./cmd/tippani
          TIPPANI_DATA="$(mktemp -d)" TIPPANI_BIND=127.0.0.1:8080 /tmp/tippani serve &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 20); do
            if /tmp/tippani healthcheck; then ok=1; break; fi
            sleep 0.5
          done
          [ "$ok" = 1 ] || { echo "server never became healthy"; exit 1; }
          # A dead port must make healthcheck fail (non-zero exit).
          if TIPPANI_BIND=127.0.0.1:8099 /tmp/tippani healthcheck; then
            echo "healthcheck should have failed against a dead port"; exit 1
          fi
          echo "healthcheck smoke test passed"

  # -race, and why it is its own job rather than a flag on the one above.
  #
  # Two files exist for the sole purpose of catching a locking regression —
  # conflict_pool_test.go and write_lock_test.go — and until 1.7.4 neither had
  # ever run under the detector. The DSN takes the write lock at BEGIN
  # (_txlock=immediate) and both drive real goroutines against a real SQLite
  # file, so a data race there is a data race in production, not a test artefact.
  #
  # But the whole-suite sweep cost TWENTY-NINE MINUTES at 1.7.4, and the reason is
  # specific to this app: modernc.org/sqlite is pure Go, so -race instruments
  # the entire database engine — every btree page and every VDBE step — and not
  # merely this repo's own code, as it would with a cgo driver. internal/httpapi
  # alone is 143s unraced and ~29m raced. The v1.7.4 run finished 43 seconds
  # inside its 30-minute timeout, which is not a margin, and 1.8.0 adds tests.
  #
  # MEASURED AGAIN 2026-09-01, AND THE NIGHTLY SWEEP IS NOW AT RISK. On an
  # otherwise idle developer machine, `go test -race ./internal/httpapi/` DID NOT
  # FINISH IN 55 MINUTES — it panicked on the timeout with the suite still
  # working steadily: no data race, no deadlock, five goroutines alive and one
  # test in newTestServer. The package holds 949 test functions now and each one
  # builds a fresh database through every migration, so the number above has
  # roughly doubled since it was written. The per-push job below is unaffected —
  # it ran its five named tests in 45 seconds at 3.0.0 — but `-timeout 60m` on the
  # nightly is no longer a margin either, and what it will do on a runner is not
  # something a developer machine can answer. The runner answered: the nightly on
  # 2.2.9 (run 36112406641) stopped at "test timed out after 1h0m0s" in
  # internal/httpapi while every other package passed. So that package is split
  # six ways by test name, in race-nightly-httpapi below.
  #
  # Raising the number would have bought one release and made every push wait
  # half an hour, and a job that slow is a job people stop reading. So the split
  # is by value: the locking tests run raced on every push to main and every pull
  # request, which is what that original comment actually wanted. It took 45
  # seconds on a runner at 3.0.0, before the three #40 tests joined it. The full
  # sweep runs nightly, where the time is free.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: The locking tests, under -race
        if: github.event_name != 'schedule'
        run: |
          set -o pipefail
          # The locking tests, and the three that hold the pool full to check the
          # health check, the refusal at the /api door and the in-flight table (#40).
          names='TestDuplicatePostUnderPoolPressure|TestConcurrentDuplicatePostsAllConflict|TestConcurrentDuplicateDialoguePostsAllConflict|TestConcurrentReadThenWriteTransactions|TestReadersOverlapAWriter|TestHealthzAnswers503WhenNoConnectionComesFree|TestAnAPIRequestIsRefusedWhenNoConnectionComesFree|TestAHungRequestIsNamedInTheLogWhileItHangs'
          # -count=1: setup-go caches the build cache, and a cached test result
          # would print as a PASS without the test running under the detector.
          go test -race -count=1 -v -timeout 15m -run "^($names)\$" ./internal/httpapi/ ./internal/store/ 2>&1 | tee /tmp/race.log
          # A -run filter that matches nothing still exits 0, and "ok, 0 tests"
          # is indistinguishable from "ok" at a glance. That false green has
          # already cost this repo once during 1.7.4, when a filtered run
          # reported success while the test it named did not exist. Every name
          # above must appear as a PASS or this job fails.
          fail=0
          for t in $(echo "$names" | tr '|' ' '); do
            grep -q -- "--- PASS: $t" /tmp/race.log || { echo "::error::$t did not run under -race"; fail=1; }
          done
          exit $fail

  # THE NIGHTLY SWEEP, SHARDED BY PACKAGE. It used to be one job — `go test -race
  # -timeout 60m ./...` — and a red result named nothing but "the suite". Sharding
  # by package names the package. It does NOT buy internal/httpapi more time:
  # `-timeout` has always applied to each package's test binary on its own, so that
  # package ran out of its hour inside the one job exactly as it would in a shard of
  # its own. It is split by test name instead, in race-nightly-httpapi below.
  #
  # `fail-fast: false` IS THE POINT OF THE MATRIX, not a detail. A race in
  # internal/store must not cancel the run that would have found the one in
  # internal/importer; the whole reason to shard is to learn about all of them in
  # the same night.
  #
  # THE LIST IS EXPLICIT AND A TEST KEEPS IT HONEST. A `go list ./...` in a shell
  # step would be self-maintaining and would also silently drop a package the day
  # its name changed, with the sweep going green because it swept nothing —
  # exactly the false green the per-push job's name-check exists to prevent.
  # TestEveryTestedPackageIsInTheNightlySweep (internal/olog) reads this file and
  # fails when a package with tests is missing from it.
  race-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./cmd/tippani
          - ./internal/auth
          - ./internal/changelog
          - ./internal/i18n
          - ./internal/importer
          - ./internal/metadata
          - ./internal/olog
          - ./internal/outbound
          - ./internal/search
          - ./internal/store
          - ./internal/updater
          - ./web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # 60m per package. None of these needs anything like it; they finish in
      # minutes and cost nothing by being allowed the same ceiling.
      - run: go test -race -count=1 -timeout 60m ${{ matrix.pkg }}

  # INTERNAL/HTTPAPI, SPLIT SIX WAYS BY TEST NAME. It is the one package that does
  # not fit an hour raced: it holds most of the repo's test functions, and almost
  # every one signs a user up (a real bcrypt hash) and builds a fresh database
  # through every migration, under a detector that instruments the whole pure-Go
  # SQLite engine. Its tests are listed from the race binary itself and dealt
  # round-robin into six shards, so a test added tomorrow lands in a shard with no
  # list to update. Each shard has its own hour.
  #
  # THE LIST COMES FROM `go test -list`, NOT FROM A FILE, and every shard checks
  # that every test it was dealt ran: a -run pattern that matches nothing exits 0
  # and reads as green, the false green the per-push job already guards against.
  # TestEveryTestedPackageIsInTheNightlySweep reads the PKG line below, so the
  # package is still counted as swept.
  #
  # THE PACKAGE IS NOT A MATRIX AXIS, so that the matrix's size is the number of
  # shards and nothing else. With a second package under a `pkg:` axis, job-total
  # would double while each package still ran six jobs, each job would take every
  # twelfth test, and half of both packages would go unraced with every per-name
  # check green. A second package that needs splitting gets a job of its own.
  race-nightly-httpapi:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PKG: ./internal/httpapi
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: shard ${{ matrix.shard }} of ${{ strategy.job-total }}, under -race
        env:
          SHARD: ${{ matrix.shard }}
          # The matrix's size, which is the shard count because shard is its only
          # axis, not a second copy of the list above.
          OF: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          go test -race -list '.*' "$PKG" | grep -E '^(Test|Example|Fuzz)' > /tmp/all.txt
          awk -v k="$SHARD" -v n="$OF" '(NR - 1) % n == k - 1' /tmp/all.txt > /tmp/mine.txt
          [ -s /tmp/mine.txt ] || { echo "::error::shard $SHARD of $OF has no tests"; exit 1; }
          echo "shard $SHARD of $OF: $(wc -l < /tmp/mine.txt) of $(wc -l < /tmp/all.txt) tests"
          go test -race -count=1 -v -timeout 60m -run "^($(paste -sd'|' /tmp/mine.txt))\$" "$PKG" 2>&1 | tee /tmp/run.log
          # Every test it was dealt, by name, as the per-push job checks each of its names:
          # a shard that ran some of its share would otherwise read as green.
          fail=0
          while read -r t; do
            grep -qE -- "^--- (PASS|SKIP): $t " /tmp/run.log || { echo "::error::$t did not run under -race"; fail=1; }
          done < /tmp/mine.txt
          exit $fail

  # THE TIER THAT PRESSES BUTTONS. A real browser against a real server against a
  # real SQLite database, signed in through the real login form. It is the only job
  # here that would have caught the bulk season/episode control answering HTTP 400
  # on every press while two tests stayed green — one asserting the client's shape,
  # one the server's, neither ever pressing the button.
  #
  # ITS OWN JOB because it needs a browser and minutes rather than seconds, and
  # because a failure here means something different from a unit failure: the app
  # is broken, not a function. The browser is the runner's own Google Chrome, named
  # once in the job's env, and the step that checks for it says why it has to be
  # named.
  journeys:
    runs-on: ubuntu-latest
    # NAMED ONCE, for the step that checks it and the harness that launches it.
    # The check step asks findBrowser itself which binary it would launch, so the
    # two cannot disagree however findBrowser orders its overrides. It sees this
    # job's env only: an override set on the journeys step alone (TIPPANI_BROWSER,
    # PUPPETEER_EXECUTABLE_PATH, CHROME_PATH) escapes the check, so one goes here.
    env:
      CHROME_PATH: /usr/bin/google-chrome
      TIPPANI_BROWSER: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web/frontend
      # puppeteer-core never downloads a browser — that is the point of -core — so
      # the scaffold's own install is cheap and the browser comes separately.
      - run: npm ci
        working-directory: scripts/screenshots
      # THE BROWSER IS THE RUNNER'S GOOGLE CHROME, BY NAME.
      #
      # ubuntu-latest (24.04) forbids unprivileged user namespaces through AppArmor,
      # and Chrome's sandbox is built on one. AppArmor's own shipped `chrome` profile
      # grants it to /opt/google/chrome/chrome; the runner image's Chromium snapshot
      # and Playwright's build are covered by nothing. /usr/bin/google-chrome
      # resolves to the .deb's wrapper script in /opt/google/chrome, which execs that
      # binary, so the profile can attach and Chrome's preferred namespace sandbox
      # can start. The .deb's setuid chrome-sandbox beside it is Chrome's fallback.
      # A build at another path has neither unless something else grants it, so
      # the step below does not assume. It starts Chrome once with the setuid
      # fallback switched off and, if that fails for want of a sandbox, once more
      # with it allowed. It says which sandbox Chrome rests on, and fails the job
      # if the fallback does not start Chrome, whether refused or only hung. A
      # first start that fails for any other reason prints Chrome's words and its
      # status as a warning, and leaves the verdict to the journeys.
      #
      # This job used to install Playwright's Chromium and leave the harness to find
      # it, and the harness never did: Playwright installs into ~/.cache/ms-playwright,
      # and capture.mjs searches PLAYWRIGHT_BROWSERS_PATH or /opt/pw-browsers. So it
      # fell through to /usr/bin/chromium, the image's snapshot build, and all 79
      # files died at launch with "No usable sandbox!" before a single press. That
      # also means the playwright@1.49.0 pin never reached the harness. The browser
      # already moved with the runner image, so nothing pinned is given up by naming
      # this one. The version is printed so that a journey that goes red with no
      # change in the repo is read against it first.
      #
      # REJECTED: lifting the restriction with the
      # kernel.apparmor_restrict_unprivileged_userns sysctl, writing an AppArmor
      # profile for Playwright's build, and --no-sandbox. Each takes a protection
      # away so a test can start, and naming the browser the OS already trusts takes
      # nothing away.
      - name: the browser to drive
        run: |
          test -x "$CHROME_PATH" || { echo "::error::no Google Chrome at $CHROME_PATH on this runner"; exit 1; }
          node --input-type=module -e "
            import { findBrowser } from './scripts/screenshots/capture.mjs'
            const p = findBrowser(null, process.env.TIPPANI_BROWSER || 'chrome').executablePath
            if (p !== process.env.CHROME_PATH) { console.log('::error::the harness would launch ' + p + ', not ' + process.env.CHROME_PATH); process.exit(1) }
            console.log('the harness launches ' + p)"
          echo "$CHROME_PATH -> $(readlink -f "$CHROME_PATH")"
          "$CHROME_PATH" --version
          # The rest, the root warning and the two starts, is a script so that a test
          # can run it against a stub Chrome (web/frontend/test/pure/sandbox-probe.test.js).
          bash scripts/sandbox-probe.sh
      - name: the journeys
        run: npm run journeys
        working-directory: web/frontend
      # WHAT A FAILING JOURNEY LEAVES BEHIND: a full-page screenshot of what the
      # reader was looking at, and what the server said while they looked. A red
      # browser test with neither is a red test nobody can act on.
      - name: what the reader saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-failures
          path: web/frontend/journey-failures/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because register-citations.test.js asks git where every
      # commit cited by the documents in its DOCS table sits in the history: an
      # ancestor of HEAD for some, reachable from a branch or tag for the rest (the
      # table says which). A depth-1 checkout has one commit and no tags, so every
      # one of those citations reads as dangling.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      # THE DESIGN RULES, RUN SEPARATELY AND STILL BLOCKING. The files in
      # test/rules read the SOURCE TEXT and assert how it is spelled — never truncate a name,
      # spacing is a constant, no emoji glyphs, the typescale. They are worth
      # keeping and they were never tests: the app can be entirely broken and every
      # one of them still passes, because none of them runs it. A suite let a
      # feature ship 100% dead that way. So they are out of `npm test` and in their
      # own step, which still fails the build — they just stop being counted as
      # evidence that anything works.
      #
      # NO `npm ci` IN scripts/screenshots IN THIS JOB, ON PURPOSE.
      # controls-ratchet.test.js (run by this step) runs controls.mjs to watch it
      # refuse a missing or unknown --fixture, and those refusals have to work on a
      # clone that installed only web/frontend. When those two cases go red, the
      # message carries what the probe printed; a package it cannot resolve is the
      # failure this missing install exists to catch, and installing here would
      # hide it. (test/pure/one-tree-per-look.test.js and engine-media.test.js, in
      # `npm test` above, load capture.mjs the same way.)
      - run: npm run lint:rules
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      # web/dist is a COMMITTED build artefact — the Go binary embeds it, so a
      # frontend change that ships without its rebuilt dist leaves the binary
      # serving the old UI with nothing to say so. Developing.md has warned
      # about this in prose since the beginning and nothing enforced it. The
      # runner has just produced a fresh dist; if it differs from what was
      # committed, the commit is incomplete.
      #
      # web/dist-inputs.json is diffed with it because `npm run build` writes
      # both, and the manifest is what the `go` job's cheap version of this check
      # reads. A manifest that could drift from the dist beside it would make
      # that check confidently wrong, which is worse than not having it.
      - name: web/dist matches the source it was built from
        run: |
          if ! git diff --exit-code -- web/dist web/dist-inputs.json; then
            echo
            echo "web/dist is stale. Run 'make frontend' and commit the result"
            echo "alongside your source change — the binary embeds this directory."
            echo
            echo "Note that 'your source change' is wider than web/frontend:"
            echo "src/i18n.js imports internal/i18n/*.txt with Vite's ?raw, so a"
            echo "locale edit changes the bundle. web/dist-inputs.json lists every"
            echo "input, and TestDistWasBuiltFromTheseInputs checks it in the go job."
            exit 1
          fi
      # docs/ui-glossary.html is GENERATED — from the catalogue, from the `glossary`
      # declarations beside the components, and from src/tokens.js. It also inlines the
      # built stylesheet, which every build renames, so it rots two ways at once. This
      # runs right after the build, when web/dist is fresh, and fails if it is stale.
      # Run `make glossary` and commit the result.
      - run: npm run glossary:check
        working-directory: web/frontend
      # The ISO 639-3 registry is generated from the pinned iso-639-3 package, which
      # only this job has installed. A bumped package with a stale table fails here.
      - run: node scripts/iso6393-data.mjs --check

  # The roadmap's generated regions are committed, so they can drift from
  # docs/data/*.json if someone edits the data and forgets to re-render. Catch it here
  # rather than letting the roadmap-bugs workflow silently correct it later.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/roadmap-data.mjs --check
      # Developing.md's file map is the answer to "where does this go", so a path in it
      # that has been renamed away is worse than no map at all — it sends someone
      # confidently to the wrong place. This asserts every path it names still exists,
      # that no package, script or workflow has been added without the map hearing, and
      # that the Maintainer: CI table has a row for every job in this file and no other.
      - run: node scripts/doc-map-check.mjs
      # The deploy's link check, on sites of its own: `ok`, a page whose <style>
      # holds a selector that is not a link and a url() that is; `bad`, the same
      # with that url() pointing at a file that is not there; and `bad-css`, with
      # the broken url() in a .css file instead. The real site has no broken url()
      # in either place, so a checker that stopped reading one of them would pass
      # there unseen.
      #
      # EACH BROKEN SITE MUST FAIL FOR ITS OWN LINK. A bare `!` passes on any
      # non-zero exit: a fixture directory gone missing exits 2, and a checker that
      # throws exits 1 with a stack trace, and either would read as green.
      - run: node scripts/site-links.mjs scripts/testdata/site-links/ok
      - name: the link check refuses each broken site, naming its link
        run: |
          set +e
          for c in "bad index.html → css/missing.png" "bad-css css/s.css → ./missing.png"; do
            site=${c%% *}; want=${c#* }
            out=$(node scripts/site-links.mjs "scripts/testdata/site-links/$site" 2>&1); code=$?
            printf '%s\n' "$out"
            if [ "$code" != 1 ] || ! grep -qF '1 broken link(s)' <<<"$out" || ! grep -qF "$want" <<<"$out"; then
              echo "::error::site-links on $site exited $code without reporting exactly '$want'"
              exit 1
            fi
          done
      # docs/wiki/ is published to the GitHub wiki by wiki.yml, and the only step
      # between those files and a reader is wiki-publish.mjs, which changes link
      # targets and nothing else — so a dead link in the source ships the moment it
      # is pushed. This asserts every internal link resolves, that the navigation names
      # only pages that exist, and that no page is published without something linking
      # to it. Three broken links and eleven phantom nav entries existed on the day the
      # directory was assembled, so none of the three is hypothetical.
      - run: node scripts/wiki-check.mjs
      # The archive-header and greetings checks used to run here as standalone
      # node scripts, because this app had no frontend test runner. It has one
      # now, and both are Vitest tests under web/frontend/test/pure — covered by
      # `npm test` in the frontend job above.
