name: release

# Cut a version and publish its GitHub Release, using the version's CHANGELOG.md section as the notes.
# The docker workflow publishes the GHCR image for the same tag.
#
# THREE WAYS IN, and one result:
#
#   1. Run it by hand with a version, 3.5.0 or v3.5.0, from the branch under "Use workflow from"
#      (main). When that version has no tag yet, this workflow cuts it: it moves the changelog's
#      "## [Unreleased]" section under "## [3.5.0] - <today>" (scripts/release-changelog.mjs), commits
#      that as "chore(release): 3.5.0" (after a "chore(dist): rebuild (release)" commit if web/dist had
#      fallen behind its source), tags the commit v3.5.0, pushes both, starts the image build, and
#      publishes the Release. Nothing else is needed first. If nothing is under [Unreleased], the notes are
#      built from the feat and fix commit subjects since the last tag, and the run says so; if there is
#      nothing of either it stops before it touches anything.
#   2. Push a tag v3.5.0 yourself (the changelog section already written and committed). The Release is
#      published and the docker workflow, which also listens for tags, builds the image.
#   3. Run it by hand with a version that already has a tag (or from a tag): the Release is republished,
#      to backfill one that was missed. Nothing is cut or pushed.
#
# WHY THE IMAGE BUILD IS STARTED EXPLICITLY. A tag pushed with this workflow's own token starts no other
# workflow (GitHub does this on purpose, so a workflow cannot start a loop of itself), so the docker
# workflow's tag trigger never fires for a tag cut here. `gh workflow run` is the one thing the token may
# start, and docker-publish.yml reads the tag from the ref it is run on, so it builds the same image a
# pushed tag would.
#
# THE RELEASE COMMIT IS NOT RUN THROUGH CI, for the same reason, so the commit before it is the one CI
# judged. It changes CHANGELOG.md and nothing else (a dist rebuild, if one was needed, is the commit
# before it). Look at CI on main before running this
# (Releasing.md): a tag on a red commit publishes a red image.
#
# IF MAIN MOVED while this ran, the push is refused (it is one atomic push of the commit and the tag, so
# neither lands) and nothing is published. Run it again.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 3.5.0 or v3.5.0. With no tag yet it is cut from the chosen branch; with a tag, its Release is republished"
        required: false
        type: string

permissions:
  contents: write
  # to start docker-publish.yml for a tag this workflow made (see above)
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # First, so a run that cannot release fails in seconds. The version is the one typed, or the tag
      # pushed. Whether its tag exists decides what happens next: `mode=new` cuts it, `mode=existing`
      # publishes what is already tagged.
      - name: Work out the version
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            tag="v${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "::error::Give a version (such as 3.5.0 or v3.5.0) when running this from a branch, or push a tag like v3.5.0, or run it from an existing tag."
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a version like 3.5.0 or v3.5.0."
            exit 1
          fi
          # Only a 404 means "no such tag". Any other failure is not an answer, and treating it as one
          # would cut a version that exists.
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1); then
            mode=existing
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            mode=new
          else
            echo "::error::Could not check whether ${tag} exists: ${out}"
            exit 1
          fi
          if [ "$mode" = new ] && [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::${tag} has no tag yet, so it is cut from a branch. Run this from main, not from a tag."
            exit 1
          fi
          case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "${tag}: mode=${mode}"

      # A tag that exists is checked out as it is. A new one starts from the branch the run was started
      # on, with every tag, so the cut can find the previous release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.mode == 'existing' && steps.tag.outputs.tag || github.ref }}
          fetch-depth: 0

      # THE TAG CARRIES THE DIST ITS SOURCE MAKES. web/dist is a committed build that `go build` embeds,
      # and CI's "web/dist matches the source" check is the gate on it. The release commit changes
      # CHANGELOG.md, which is not a dist input, so it can never make dist stale. But a head that was
      # merged with a stale dist would be tagged as it is, and everyone who builds from the tag would
      # get the old UI. So the SPA is rebuilt here, from the lockfile, and any difference is committed
      # on its own ahead of the release commit. Where dist is already current this commits nothing.
      # (The Docker image does not depend on this: its Dockerfile builds the SPA itself.) CI's check
      # passes on a dist committed from Windows, so the build is the same on this runner.
      - uses: actions/setup-node@v5
        if: steps.tag.outputs.mode == 'new'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Rebuild web/dist if the source has moved past it
        if: steps.tag.outputs.mode == 'new'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd web/frontend && npm ci && npm run build)
          if git diff --quiet -- web/dist web/dist-inputs.json && [ -z "$(git ls-files --others --exclude-standard -- web/dist)" ]; then
            echo "web/dist is current: nothing to commit"
          else
            git add -A web/dist web/dist-inputs.json
            git commit -q -m "chore(dist): rebuild (release)" -m "Rebuilt by the release workflow because the source had moved past the committed dist."
            echo "web/dist was stale and has been rebuilt"
          fi

      - name: Cut the version (changelog, commit, tag)
        if: steps.tag.outputs.mode == 'new'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          node scripts/release-changelog.mjs "$VERSION"
          git add CHANGELOG.md
          git commit -q \
            -m "chore(release): ${VERSION}" \
            -m "Cut by the release workflow. The notes are the changelog's [Unreleased] section moved under ${VERSION}, or the feat and fix commit subjects when it was empty. Range: ${prev:+${prev}..}HEAD."
          git tag -a "$TAG" -m "$TAG"
          # One push, so the commit and the tag land together or not at all.
          git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"
          echo "cut ${TAG} at $(git rev-parse --short HEAD)"

      - name: Start the image build for the new tag
        if: steps.tag.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run docker-publish.yml --ref "$TAG"

      - name: Extract changelog section
        run: |
          ver='${{ steps.tag.outputs.version }}'
          # Print the lines under "## [<ver>]" up to the next "## " heading.
          # Literal string matching (index/substr), not regex, so the [ ] in the
          # heading and the dots in the version aren't treated as metacharacters.
          awk -v ver="$ver" '
            BEGIN { start = "## [" ver "]" }
            index($0, start) == 1 { grab=1; next }
            grab && substr($0, 1, 3) == "## " { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          # Drop leading blank lines; fall back to a stub if the section is empty.
          sed -i -e '/./,$!d' notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md and the commit history for details." > notes.md
          fi

      # THE VULNERABILITY SCAN IS PART OF THE RELEASE PAGE, NOT A GATE ON IT. Pull requests and a daily run
      # (security.yml) are the gate; this records what was known at the moment of release, with the reason
      # for each accepted finding (.trivyignore.yaml), as a section at the bottom of the notes. It is not in
      # CHANGELOG.md: that file is hand-written, shown in the app, and would pick up scanner output that
      # changes with every database update. Every scan step is continue-on-error and the section says so
      # when a report is missing, so a failed scan never blocks or silently clears a release.
      - name: Trivy, repository
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          skip-dirs: .claude,node_modules
          trivyignores: .trivyignore.yaml

      - name: SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-dirs: .claude,node_modules

      - name: Build the image for scanning
        id: image
        continue-on-error: true
        run: docker build -t tippani:release .

      - name: Trivy, image
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          version: latest
          scan-type: image
          image-ref: tippani:release
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Append the known vulnerabilities to the notes
        run: |
          printf '\n' >> notes.md
          node scripts/trivy-notes.mjs trivy-fs.json trivy-image.json >> notes.md

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          # Idempotent: edit an existing Release (e.g. a re-run / backfill),
          # otherwise create it. Omit --latest so GitHub computes "Latest" by
          # semver, which keeps a backfilled older tag from stealing the badge.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md
          else
            pre=''
            [ '${{ steps.tag.outputs.prerelease }}' = true ] && pre='--prerelease'
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag $pre
          fi

      - name: Attach the scan reports and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          for f in trivy-fs.json trivy-image.json sbom.cdx.json; do
            [ -s "$f" ] && gh release upload "$tag" "$f" --clobber || echo "no $f to attach"
          done
