name: release

# Cut a GitHub Release whenever a version tag (v*) is pushed, using that
# version's CHANGELOG.md section as the release notes. The docker workflow
# already publishes the GHCR image on the same tag; this adds the human-facing
# Release entry so the Releases page stays in step with the tags (previously
# releases were written by hand, which is why v0.4.x had images + tags but no
# Release).
#
# THREE WAYS IN:
#   - push a tag (git tag vX.Y.Z && git push origin vX.Y.Z): the release job alone, as before.
#   - run it from the Actions tab on main with a VERSION (3.4.3, no "v"): the prepare job
#     checks the changelog section is already on main, tags main's head, starts the image
#     build, and the release job then runs in the same run. The release commit stays the
#     hand-written `chore(release): X.Y.Z` of docs/wiki/Releasing.md, so unlike a flow that
#     dates an [Unreleased] heading there is nothing to commit here and no key that can
#     push to main.
#   - run it with an existing TAG (v0.4.0) to backfill a Release that was missed.
#
# WHY THE PREPARE JOB STARTS THE IMAGE ITSELF. A tag pushed with GITHUB_TOKEN does not start
# other workflows, so docker-publish.yml would never see it. It has a workflow_dispatch trigger
# and builds whatever ref it is run on, so it is dispatched on the new tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 3.4.3 (no v). Run from main; its CHANGELOG.md section must already be there."
        required: false
        type: string
      tag:
        description: "Existing tag to (re)publish a Release for, e.g. v0.4.0 (leave the version empty)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

# One release at a time; a second waits rather than cancelling the first, which
# may be half way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A run with a version only. Makes the tag the release job then publishes.
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check this run is from main and the version is new
        env:
          VERSION: ${{ inputs.version }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            echo "::error::Give a version or an existing tag, not both."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is cut from main, but this run is for '$GITHUB_REF'. Run it again and choose main under 'Use workflow from'."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version '$VERSION' is not like 3.4.3 (three numbers, no leading v)."
            exit 1
          fi
          if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::The tag v$VERSION already exists. A tag is never moved: choose a higher version."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check the changelog section is on main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section on main. Write it and commit chore(release): $VERSION first (docs/wiki/Releasing.md)."
            exit 1
          fi

      - name: Tag main and start the image build
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh workflow run docker-publish.yml --ref "v$VERSION"

  release:
    needs: prepare
    # prepare is skipped for a tag push and for a backfill; either is still a release.
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ] && [ -n "${{ github.event.inputs.version }}" ]; then tag="v${{ github.event.inputs.version }}"; fi
          tag="${tag:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Extract changelog section
        run: |
          ver='${{ steps.tag.outputs.version }}'
          # Print the lines under "## [<ver>]" up to the next "## " heading.
          # Literal string matching (index/substr), not regex, so the [ ] in the
          # heading and the dots in the version aren't treated as metacharacters.
          awk -v ver="$ver" '
            BEGIN { start = "## [" ver "]" }
            index($0, start) == 1 { grab=1; next }
            grab && substr($0, 1, 3) == "## " { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          # Drop leading blank lines; fall back to a stub if the section is empty.
          sed -i -e '/./,$!d' notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md and the commit history for details." > notes.md
          fi

      # THE VULNERABILITY SCAN IS PART OF THE RELEASE PAGE, NOT A GATE ON IT. Pull requests and a daily run
      # (security.yml) are the gate; this records what was known at the moment of release, with the reason
      # for each accepted finding (.trivyignore.yaml), as a section at the bottom of the notes. It is not in
      # CHANGELOG.md: that file is hand-written, shown in the app, and would pick up scanner output that
      # changes with every database update. Every scan step is continue-on-error and the section says so
      # when a report is missing, so a failed scan never blocks or silently clears a release.
      - name: Trivy, repository
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          skip-dirs: .claude,node_modules
          trivyignores: .trivyignore.yaml

      - name: SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-dirs: .claude,node_modules

      - name: Build the image for scanning
        id: image
        continue-on-error: true
        run: docker build -t tippani:release .

      - name: Trivy, image
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          version: latest
          scan-type: image
          image-ref: tippani:release
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Append the known vulnerabilities to the notes
        run: |
          printf '\n' >> notes.md
          node scripts/trivy-notes.mjs trivy-fs.json trivy-image.json >> notes.md

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          # Idempotent: edit an existing Release (e.g. a re-run / backfill),
          # otherwise create it. Omit --latest so GitHub computes "Latest" by
          # semver, which keeps a backfilled older tag from stealing the badge.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          fi

      - name: Attach the scan reports and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          for f in trivy-fs.json trivy-image.json sbom.cdx.json; do
            [ -s "$f" ] && gh release upload "$tag" "$f" --clobber || echo "no $f to attach"
          done
