name: docker

# Build the multi-arch image and push it to GHCR so `docker compose up` can
# pull ghcr.io/<owner>/tippani. Runs on pushes to main, on the release branch of
# the moment, and on version tags.
#
# A RELEASE BRANCH GETS AN IMAGE NAMED AFTER IT — `:v3` — and nothing that moves:
# no `latest`, no `edge`, no series pointer. The alternative was what we had,
# which is that the only way to try the branch before it merges is to build the
# image yourself, and "test this on the NAS it is built for" then costs a
# toolchain on the NAS. A branch tag is a pointer that only somebody who typed
# the branch name can be pulling, so nobody tracking a release tag can be moved
# onto unfinished work by it.
on:
  push:
    branches: [main, v3]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A native build of this image takes 2-3 minutes. Without a cap the job
    # inherits GitHub's 360-minute default, and on 2026-08-14 that is what a
    # broken build actually did: an unpinned frontend stage started building
    # under QEMU, sat at "Build and push" with no progress output for half an
    # hour, and had five and a half hours of runner time left to burn on both
    # the main and the tag build at once. There was no way to tell a slow build
    # from a hung one. 30 minutes is ~10x the real cost, so anything that trips
    # it is a fault rather than a busy runner, and it fails while somebody is
    # still watching.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth: 0 for the tag list — the ranking step below has to compare
      # this tag against every other one, and a shallow clone carries none.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # WHICH TAG IS ALLOWED TO MOVE A MOVING TAG.
      #
      # `latest` and `1.7` are pointers, and the workflow used to let whichever
      # build finished last claim them. That is only ever the newest release by
      # coincidence — the ordering is the ordering of BUILD COMPLETION, not of
      # version. On 2026-08-09 an unpushed v1.3.0 tag went up alongside v1.7.2,
      # both fired, v1.3.0 built ~2 minutes slower on a colder cache, finished
      # second, and `:latest` came to mean 1.3.0. Everyone tracking `:latest`
      # was silently downgraded four minor versions.
      #
      # So the pointers are gated on rank rather than on arrival. `{{version}}`
      # is deliberately NOT gated: an immutable per-release tag must always be
      # published, and it is what recovery is done with.
      - name: Rank this tag against the others
        id: rank
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          series="${tag%.*}"                                        # v1.7.2 -> v1.7
          newest_in_series=$(git tag -l "${series}.*" --sort=-v:refname | head -n1)
          if [ "$tag" = "$newest" ]; then overall=true; else overall=false; fi
          if [ "$tag" = "$newest_in_series" ]; then in_series=true; else in_series=false; fi
          echo "overall=$overall"     >> "$GITHUB_OUTPUT"
          echo "in_series=$in_series" >> "$GITHUB_OUTPUT"
          echo "tag=$tag newest=$newest newest_in_series=$newest_in_series -> latest=$overall series=$in_series"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A git tag v1.2.3 -> image tag 1.2.3 always; plus 1.2 only if it is the
          # newest v1.2.x, plus latest only if it is the newest tag in the repo.
          # Pushes to main -> edge + a short-sha tag and nothing that moves.
          #
          # latest=false because `latest=auto` means "any non-prerelease semver
          # tag", which is the thing that broke: v1.3.0 is a non-prerelease semver
          # tag. Rank, not shape, decides. See the ranking step above.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.in_series == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.overall == 'true' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            # The branch's own name, for a non-default branch only: `:v3` while
            # v3 is in flight, and nothing at all once it merges and the branch
            # stops being pushed to.
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
          flavor: |
            latest=false

      # WHAT THE BRANCH BUILD CALLS ITSELF.
      #
      # metadata-action's `version` output for a branch push is the branch name,
      # and the branch is named "v3" — which internal/updater/parseSemver reads
      # as 3.0.0. Stamped in unchanged, the branch build would show "3.0.0" in
      # Settings as though it were the release, and, being "newer" than every
      # real tag, would never offer an update: a tester could sit on a stale
      # unfinished image forever and be told they were current. The prefix makes
      # it non-semver, which is the case the updater already handles correctly
      # ("can't assert this is current, so offer") and which `edge` on main
      # already takes. Tag builds are untouched — their version IS the release.
      - name: Version to stamp into the binary
        id: ver
        run: |
          set -euo pipefail
          v='${{ steps.meta.outputs.version }}'
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *) [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ] || v="edge-${GITHUB_REF_NAME}" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "stamping $v"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Stamp the version decided above (0.5.0 on a tag, "edge" on main,
          # "edge-v3" on the release branch) into the binary so the in-app
          # update check knows what it's running.
          # TMDB_TOKEN is the built-in film/show credential (a v4 read access
          # token), kept in a repository secret so it is not in the source. An
          # unset secret builds an image with no built-in, which behaves exactly
          # as every release before this one did: 503 until a key is saved.
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            TMDB_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
            TVDB_TOKEN=${{ secrets.TVDB_API_KEY }}
          # Multi-arch: amd64 is the tested arch; arm64 is published too (pure Go,
          # CGO-free, so it cross-compiles cleanly) but is UNTESTED — shipped so
          # arm64 NAS owners (Synology/QNAP/Pi) can try it and report back.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
