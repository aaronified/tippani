# The roadmap's "Known bugs" block is GENERATED from open issues carrying the `bug`
# label — see scripts/roadmap-data.mjs and .github/workflows/roadmap-bugs.yml.
# The generator finds fields by their rendered `### <label>` heading, so DO NOT rename
# a label here without changing FIELD_LABELS in scripts/roadmap-data.mjs.
name: Report a bug
description: Something in Tippani is broken or behaves wrongly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the trouble.

        **Once I have confirmed it, your issue title becomes the heading of an entry on the
        [roadmap's Known bugs list](https://aaronified.github.io/tippani/roadmap.html#bugs)** —
        so write it as a description of the fault ("Editing a dialogue's timestamp clears
        the character name") rather than "it's broken".

        Confirming means I have read it and, where I can, reproduced it; the roadmap then
        picks it up on its own and drops it again when the issue is closed. It is a gate
        rather than a queue — filing here is not a request for permission, it is how the
        bug gets fixed. The gate exists because that list is a published page, and
        anything on it is something I am telling everyone is true.

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched the [open issues](https://github.com/aaronified/tippani/issues) and the roadmap's [Known bugs](https://aaronified.github.io/tippani/roadmap.html#bugs), and this is not already there.
          required: true
        - label: I checked the [release notes](https://github.com/aaronified/tippani/releases) in case it is already fixed in a newer version.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → Updates shows it. Use `dev` if you built from source.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How you are running it
      options:
        - Docker (compose)
        - Docker (plain run)
        - Binary on the host
        - The public demo
        - Built from source
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you saw. One paragraph is plenty.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Numbered, starting from a fresh page load. A bug I can reproduce gets fixed; one
        I cannot usually does not. If it needs particular data, say so — the demo's
        sample library is a fine starting point.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on Fedora 42 / Safari on iOS 18

  - type: textarea
    id: logs
    attributes:
      label: Server log around the failure
      description: >
        Optional, and often decisive. `docker logs tippani --tail 100`, or the terminal
        output. Nothing secret is logged by design, but read it before pasting.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Screenshots, a browser-console error, how often it happens, whether it survives a
        reload. Drag images straight in.
